# Backend FastAPI en Render (soporta WebSockets y procesos largos, a diferencia de Vercel Functions)
services:
  - type: web
    name: plagio-upc-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SEARCH_ENGINE
        value: duckduckgo
